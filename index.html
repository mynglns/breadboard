<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A browser-based interactive 3D model viewer." />
    <meta name="theme-color" content="#0b0e0d" />
    <title>LED Flasher / 3D Model</title>
    <link rel="stylesheet" href="./styles.css?v=4fa7ab2" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="viewerShell" aria-label="Interactive 3D model viewer">
      <div id="viewer" aria-label="Interactive 3D LED flasher model"></div>

      <div class="loading-state" id="loadingState" role="status" aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        <span id="loadingLabel">Loading model…</span>
      </div>

      <button class="control-button" id="resetView" type="button" aria-label="Reset camera view">
        <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M3.2 8.5a5.6 5.6 0 1 0 1.4-3.7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
          <path d="M3.2 3.8v3.5h3.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Reset</span>
      </button>

      <p class="hint">Drag to orbit · scroll to zoom</p>
    </main>

    <noscript>This 3D model viewer needs JavaScript enabled.</noscript>
    <script type="module" src="./app.js?v=4fa7ab2"></script>
  </body>
</html>
